[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: johnincharleston.com (apex), not www. Netlify's dashboard
# domain settings already handle this, but codifying it here keeps it
# explicit and version-controlled rather than relying solely on a dashboard
# toggle.
[[redirects]]
  from = "https://www.johnincharleston.com/*"
  to = "https://johnincharleston.com/:splat"
  status = 301
  force = true

# These two blog posts were removed (synthetic seed content, not real
# editorial history) but the URLs were publicly live, so redirect rather
# than leave a dead link — both covered similar cost-transparency ground
# to /cost-of-living, which is the most relevant surviving page.
[[redirects]]
  from = "/blog/what-is-a-cdd-fee"
  to = "/cost-of-living"
  status = 301
  force = true

[[redirects]]
  from = "/blog/cdd-vs-hoa-whats-the-difference"
  to = "/cost-of-living"
  status = 301
  force = true
